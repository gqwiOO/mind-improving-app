# Список прочитаного.
#
# Додати книжку = дописати блок згори. Обов'язкові тільки `id` і `title`.
#   id      — унікальний рядок, будь-який (використовується лише всередині)
#   title   — назва
#   year    — рік, коли прочитав
#   rating  — 0–5, можна половинки: 4.5
#   note    — власне враження, вільний текст
#   url     — посилання куди завгодно
#   status  — read (за замовчуванням) або reading

books:
  - id: dungeon-crawler-carl
    title: Dungeon Crawler Carl
    status: reading
    note: несподівано смішно як на книжку про кінець світу

  - id: shantaram
    title: Шантарам
    year: 2026
    rating: 4
    note: >-
      Довга, місцями надто пафосна, але Бомбей після неї стає місцем, де ти ніби
      вже був. Друга половина слабша за першу.

  - id: pragmatic-programmer
    title: The Pragmatic Programmer
    year: 2026
    rating: 5
    note: >-
      Та рідкісна технічна книжка, яка не застаріла за двадцять років, бо вона
      не про інструменти, а про звички.

  - id: thinking-fast-slow
    title: Мислення швидке й повільне
    year: 2025
    rating: 4.5
    note: >-
      Читається важко, але змінює те, як ти дивишся на власні рішення. Половину
      прикладів пам'ятаю досі.

  - id: project-hail-mary
    title: Project Hail Mary
    year: 2025
    rating: 5
    note: Найкраще, що читав за рік. Більше нічого не скажу, бо зіпсую.

  - id: sapiens
    title: Sapiens
    year: 2025
    rating: 4
    note: Перша третина чудова, далі автора несе у власні узагальнення.

  - id: harry-potter
    title: Гаррі Поттер, т. 1–7
    year: 2024
    rating: 5
    note: Перечитував із дітьми. Тримає навіть на десятий раз.

  - id: deep-work
    title: Deep Work
    year: 2024
    rating: 3.5
    note: Хороша ідея, розтягнута на книжку. Вистачило б довгої статті.

  - id: kobzar
    title: Кобзар
    year: 2023
